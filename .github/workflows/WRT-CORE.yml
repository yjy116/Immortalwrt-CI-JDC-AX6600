#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      DAEDE_COMMIT:
        required: false
        type: string
      HONK_COMMIT:
        required: false
        type: string
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: false
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        default: false
        type: boolean
      CI_NAME:
        required: false
        type: string
      WRT_ARCH:
        required: false
        type: string
env:
  DAEDE_COMMIT: ${{inputs.DAEDE_COMMIT}}
  HONK_COMMIT: ${{inputs.HONK_COMMIT}}
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}
  WRT_DIR: '/mnt/wrt'
  CI_NAME: ${{inputs.CI_NAME}}
  WRT_ARCH: ${{inputs.WRT_ARCH}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    # Match the dependency bootstrap's supported noble toolchain.
    runs-on: ubuntu-24.04
    steps:
      - name: Install BC
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq install bc

      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v2
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/glade* /usr/local/share/chromium /usr/local/share/powershell"
          testing: false

      - name: Checkout Projects
        uses: actions/checkout@main
      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix python3-netifaces libfuse-dev
          dos2unix "$GITHUB_WORKSPACE/Scripts/init_build_environment.sh"
          sudo bash "$GITHUB_WORKSPACE/Scripts/init_build_environment.sh"
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          if command -v go >/dev/null 2>&1; then
            echo "GO_INSTALLED=true" >> "$GITHUB_ENV"
          else
            echo "GO_INSTALLED=false" >> "$GITHUB_ENV"
          fi
          sudo mkdir -p "$WRT_DIR"
          sudo chown "$USER:$USER" "$WRT_DIR"
#          sudo chown $USER:$GROUPS $GITHUB_WORKSPACE
#          sudo mkdir -p /mnt/build_wrt
#          sudo chown $USER:$USER /mnt/build_wrt
#          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Setup Go
        if: env.GO_INSTALLED != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - run: go version

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

          echo "WRT_CI=$WRT_CI" >> $GITHUB_ENV
          [[ -z $WRT_ARCH ]] && {
            export WRT_ARCH=$(sed -n 's/.*_DEVICE_\(.*\)_DEVICE_.*/\1/p' $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt | head -n 1)
            echo "WRT_ARCH=$WRT_ARCH" >> $GITHUB_ENV
          }
          echo "$WRT_REPO/$WRT_BRANCH" > "$GITHUB_WORKSPACE/repo_flag"
      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO "$WRT_DIR"
          ln -sfn "$WRT_DIR" "$GITHUB_WORKSPACE/wrt"

          cd "$WRT_DIR" && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: 校验 MiniUPnP 补丁升级兼容性
        run: bash "$GITHUB_WORKSPACE/tests/run_miniupnpd_tests.sh"

      - name: 校验 LuCI 端口映射解析兼容性
        run: |
          sudo apt-get install -y cmake libjson-c-dev
          bash "$GITHUB_WORKSPACE/tests/run_luci_upnp_tests.sh"

      - name: Cache Compiler Outputs
        uses: actions/cache@v5
        with:
          path: ${{ env.WRT_DIR }}/.ccache
          key: ccache-${{ env.WRT_ARCH }}-${{ hashFiles('**/repo_flag') }}-${{ env.WRT_DATE }}
          restore-keys: |
            ccache-${{ env.WRT_ARCH }}-${{ hashFiles('**/repo_flag') }}-

      - name: Cache Staging Dependencies
        uses: actions/cache@v5
        with:
          path: ${{ env.WRT_DIR }}/staging_dir
          key: staging-${{ env.WRT_ARCH }}-${{ hashFiles('**/repo_flag') }}-${{ env.WRT_HASH }}-${{ env.WRT_DATE }}
          restore-keys: |
            staging-${{ env.WRT_ARCH }}-${{ hashFiles('**/repo_flag') }}-${{ env.WRT_HASH }}-

      - name: Refresh the cache
        run: |
          if [ -d "$WRT_DIR/staging_dir" ]; then
            find "$WRT_DIR/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
                find "$dir" -type f -exec touch {} +
            done
          fi            



      - name: Update Feeds
        run: |
          cd "$WRT_DIR"

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd "$WRT_DIR/package"

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Settings
        run: |
          . $GITHUB_WORKSPACE/Scripts/function.sh
          cd "$WRT_DIR"
          
          generate_config
          
          $GITHUB_WORKSPACE/Scripts/Settings.sh

          cp .config .config.requested
          make defconfig -j$(nproc) && make clean -j$(nproc)

      - name: 核验新增插件默认值和主题
        run: |
          timeout 60s python3 "$GITHUB_WORKSPACE/tests/test_addon_defaults.py"
          timeout 60s python3 "$GITHUB_WORKSPACE/tests/test_netspeedtest_check.py"
          python3 "$GITHUB_WORKSPACE/Scripts/netspeedtest_check.py" "$WRT_DIR"
          timeout 60s python3 -S "$WRT_DIR/package/netspeedtest/luci-app-netspeedtest/root/usr/bin/speedtest" --version
          timeout 60s bash "$GITHUB_WORKSPACE/tests/test_vantage_defaults.sh"
          timeout 60s bash "$GITHUB_WORKSPACE/tests/test_upstream_package_alignment.sh"
          cd "$WRT_DIR/package/luci-theme-vantage"
          timeout 60s node --test tests/package.test.js tests/theme.test.js tests/acl.test.js

      - name: 核验 OWRT 迁移与全部插件选择
        if: inputs.WRT_REPO == 'https://github.com/VIKINGYFY/immortalwrt.git' && inputs.WRT_BRANCH == 'owrt'
        run: |
          timeout 60s python3 "$GITHUB_WORKSPACE/tests/test_owrt_migration.py"
          timeout 60s bash "$GITHUB_WORKSPACE/tests/test_owrt_profile.sh"
          python3 "$GITHUB_WORKSPACE/Scripts/owrt.py" verify "$WRT_DIR"

      - name: 核验并补齐 SONiC Fullcone 上游修复
        if: inputs.WRT_REPO == 'https://github.com/VIKINGYFY/immortalwrt.git' && inputs.WRT_BRANCH == 'owrt'
        run: |
          timeout 60s python3 "$GITHUB_WORKSPACE/tests/test_owrt_fullcone.py"
          python3 "$GITHUB_WORKSPACE/Scripts/owrt_fullcone.py" "$WRT_DIR"

      - name: Verify OWRT firewall4 source archive metadata
        if: inputs.WRT_REPO == 'https://github.com/VIKINGYFY/immortalwrt.git' && inputs.WRT_BRANCH == 'owrt'
        run: |
          timeout 60s python3 tests/test_owrt_firewall4.py -v
          python3 Scripts/owrt_firewall4.py "$WRT_DIR"

      - name: 核验上游 UPnP JSON 界面和配置租约迁移
        run: |
          timeout 60s python3 "$GITHUB_WORKSPACE/tests/test_upnp_harness.py"
          python3 "$GITHUB_WORKSPACE/Scripts/luci_upnp/upstream.py" "$WRT_DIR/package/packages" \
            --ucode "$LUCI_UPNP_UCODE" --library "$LUCI_UPNP_LIB" --receipt "$WRT_DIR/LUCI-UPNP-SOURCE.json"
          grep -Fxq 'CONFIG_PACKAGE_luci-app-upnp=y' "$WRT_DIR/.config"

      - name: 安装 MiniUPnP 源码感知修复核验钩子
        run: |
          timeout 60s python3 "$GITHUB_WORKSPACE/tests/test_upnp_layout.py"
          python3 "$GITHUB_WORKSPACE/Scripts/miniupnpd/install.py" "$WRT_DIR/package/packages/miniupnpd"
          grep -Fxq 'CONFIG_PACKAGE_miniupnpd-nftables=y' "$WRT_DIR/.config"
          if grep -Fxq 'CONFIG_PACKAGE_miniupnpd-iptables=y' "$WRT_DIR/.config"; then
            echo 'ERROR: incompatible UPnP backends selected' >&2
            exit 1
          fi

      - name: 校验 Honk、DAE/DAED 与 USB 打印插件
        run: |
          timeout 60s python3 -m unittest discover -s tests -p 'test_proxy_*.py' -v
          timeout 60s bash tests/test_daede_service_guard.sh "$WRT_DIR/package/openwrt-daede"
          timeout 60s node tests/test_daede_switch.cjs "$WRT_DIR/package/openwrt-daede"
          timeout 60s bash tests/test_daede_migration.sh
          HONK_SOURCE_DIR="$WRT_DIR/package/openwrt-honk" timeout 60s python3 -m unittest discover -s tests -p 'test_honk_boot*.py' -v
          timeout 60s python3 -m unittest discover -s tests -p 'test_honk_rpc_registry.py' -v
          timeout 60s node tests/test_honk_settings.cjs "$WRT_DIR/package/openwrt-honk"
          timeout 60s node tests/test_honk_overview.cjs "$WRT_DIR/package/openwrt-honk"
          cd "$WRT_DIR"
          for package in honk luci-app-honk dae daed luci-app-daede \
            printer-support kmod-usb-printer p910nd luci-app-usb-printer; do
            grep -Fxq "CONFIG_PACKAGE_${package}=y" .config || {
              echo "::error::Required package disappeared after defconfig: $package"
              exit 1
            }
          done

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          timeout 60s python3 tests/test_download_packages.py -v
          python3 Scripts/proxy_sources.py fetch honk \
            --source "$WRT_DIR/package/openwrt-honk" --downloads "$WRT_DIR/dl"
          bash Scripts/download_packages.sh "$WRT_DIR"

      - name: Verify proxy archives and embedded Honk/Doona assets
        if: env.WRT_TEST != 'true'
        run: |
          for source in daede honk; do
            python3 Scripts/proxy_sources.py verify "$source" \
              --source "$WRT_DIR/package/openwrt-$source" --downloads "$WRT_DIR/dl"
          done
          HONK_SOURCE_DIR="$WRT_DIR/package/openwrt-honk" HONK_ASSET_DIR="$WRT_DIR/dl" \
            HONK_FIRMWARE_CONFIG="$WRT_DIR/.config" \
            timeout 60s python3 tests/test_honk_integration.py -v

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd "$WRT_DIR"

          make -j$(nproc) || make -j1 V=s

      - name: Delete Old Cache
        run: |
          # 获取缓存列表并删除
          delete_cache_prefix() {
            local prefix="$1"
            gh cache list --limit 100 --json id,key --jq ".[] | select(.key | startswith(\"$prefix\")) | .id" | while read -r id; do
              gh cache delete "$id"
            done
          }

          delete_cache_prefix "ccache-${{ env.WRT_ARCH }}-${{ hashFiles('**/repo_flag') }}-"
          delete_cache_prefix "staging-${{ env.WRT_ARCH }}-${{ hashFiles('**/repo_flag') }}-${{ env.WRT_HASH }}-"
          delete_cache_prefix "${{ env.WRT_ARCH }}-${{ hashFiles('**/repo_flag') }}-"
          # 输出缓存状态
          echo "========cache status========"
          echo "ccache: $(du -sh "$WRT_DIR/.ccache" | cut -f 1)"
          echo "staging: $(du -sh "$WRT_DIR/staging_dir" | cut -f 1)"

      - name: Machine Information
        run: |
          cd "$WRT_DIR"

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd "$WRT_DIR" && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt
          cp ./package/openwrt-daede/ci/DAEDE-SOURCE.txt ./upload/DAEDE-SOURCE.txt
          cp ./package/openwrt-honk/ci/HONK-SOURCE.txt ./upload/HONK-SOURCE.txt
          cp ./LUCI-UPNP-SOURCE.json ./upload/LUCI-UPNP-SOURCE.json

          if [[ $WRT_TEST != 'true' ]]; then
            if [[ "$WRT_REPO" == 'https://github.com/VIKINGYFY/immortalwrt.git' && "$WRT_BRANCH" == 'owrt' ]]; then
              cp ./FULLCONE-SOURCE.json ./upload/FULLCONE-SOURCE.json
              cp ./FIREWALL4-SOURCE.json ./upload/FIREWALL4-SOURCE.json
              mapfile -t manifests < <(find ./bin/targets/ -type f -name '*.manifest')
              test "${#manifests[@]}" -gt 0
              for manifest in "${manifests[@]}"; do
                python3 "$GITHUB_WORKSPACE/Scripts/owrt.py" manifest "$PWD" --manifest "$manifest"
              done
            fi
            test -s ./miniupnpd-nftables-backports.json
            cp ./miniupnpd-nftables-backports.json ./upload/MINIUPNPD-SOURCE.json
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            make clean -j$(nproc)
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.CI_NAME}}-${{env.WRT_CONFIG}}_${{env.WRT_DATE}}
          files: ${{ env.WRT_DIR }}/upload/*.*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！
            不要问，刷就完事了！

            全系带开源硬件加速，别问了！

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}
