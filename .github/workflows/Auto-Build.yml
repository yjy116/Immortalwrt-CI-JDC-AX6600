name: 自动检查编译

on:
  schedule:
    - cron: "0 16 */10 * *"
  workflow_dispatch:

permissions: write-all

concurrency:
  group: 自动检查编译
  cancel-in-progress: true

jobs:
  check_updates:
    name: 检查上游更新
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: 检查上游更新
        id: check
        env:
          SOURCE: VIKINGYFY/immortalwrt
          BRANCH: main
          LOOKBACK_DAYS: "10"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          since=$(date -u -d "$LOOKBACK_DAYS days ago" +'%Y-%m-%dT%H:%M:%SZ')
          echo "Checking commits for $SOURCE:$BRANCH since $since"

          response=$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$SOURCE/commits?sha=$BRANCH&since=$since")

          if echo "$response" | grep -q '"sha"'; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_build=false" >> "$GITHUB_OUTPUT"

  clean:
    name: 清理旧版本
    needs: check_updates
    if: needs.check_updates.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 清理旧发布和运行记录
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          delete_releases: true
          releases_keep_latest: 2
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 0

  trigger_build:
    name: 触发固件编译
    needs: [check_updates, clean]
    if: needs.check_updates.outputs.should_build == 'true' && needs.clean.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 触发京东云雅典娜编译
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          curl -fsSL -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/JDC-AX6600.yml/dispatches" \
            -d '{"ref":"main","inputs":{"PACKAGE":"","TEST":"false","CLEAR_CACHE":"false"}}'
