branch:
  - reg: "^main$"
    buttons:
      - name: Build JDC AX6600 Firmware
        description: Build ${WRT_CONFIG} on CNB, config-only test=${WRT_TEST}
        event: web_trigger_build
        isDefault: true
        env:
          WRT_CONFIG: JDC-AX6600
          WRT_THEME: aurora
          WRT_NAME: JDC-AX6600
          WRT_SSID: Athena
          WRT_WORD: "77915558"
          WRT_IP: 192.168.101.1
          WRT_PW: none
          WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
          WRT_BRANCH: main
          WRT_SOURCE: VIKINGYFY/immortalwrt
        inputs:
          WRT_TEST:
            name: Config-only test
            description: Generate final .config without compiling firmware.
            required: false
            type: switch
            default: "false"
            options:
              - name: Build firmware
                value: "false"
                description: Compile firmware and upload artifacts.
              - name: Generate config only
                value: "true"
                description: Stop after make defconfig and upload .config.
          WRT_BRANCH:
            name: ImmortalWrt branch
            description: Source branch to clone from WRT_REPO.
            required: false
            type: input
            default: main
          WRT_PACKAGE:
            name: Extra config lines
            description: Append temporary .config lines, one per line.
            required: false
            type: textarea
            placeholder: |
              CONFIG_PACKAGE_example=y
              # CONFIG_PACKAGE_other is not set
